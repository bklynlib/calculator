<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brooklyn Public Library Use Value Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { color: #333; }
        label { display: block; margin-top: 10px; }
        input, button { margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Brooklyn Public Library Use Value Calculator</h1>
    <label for="visits">Number of library visits per year:</label>
    <input type="number" id="visits" name="visits"><br>
    <label for="avgCost">Average cost of a library visit:</label>
    <input type="text" id="avgCost" name="avgCost"><br>
    <button onclick="calculateValue()">Calculate Value</button>
    <h2 id="result"></h2>
    <script>
        function calculateValue() {
            var visits = document.getElementById('visits').value;
            var avgCost = document.getElementById('avgCost').value;
            var totalValue = visits * avgCost;
            document.getElementById('result').innerText = 'Total Use Value: $' + totalValue;
        }
    </script>
</body>
</html>
